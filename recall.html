<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Recall Vault</title>

<style>

body{
    margin:0;
    font-family:Verdana,sans-serif;
    color:white;
    background:
    linear-gradient(180deg,#050510,#151530);
}

#stars{
    position:fixed;
    width:100%;
    height:100%;
    background-image:
    radial-gradient(white 1px, transparent 1px);
    background-size:30px 30px;
    opacity:.3;
    z-index:-1;
}

header{
    text-align:center;
    padding:30px;
    background:
    linear-gradient(90deg,
    #ff00aa,
    #00e5ff,
    #7dff00);

    color:black;

    border-bottom:5px solid white;
}

h1{
    font-size:4rem;
    margin:0;
    text-shadow:
    3px 3px white;
}

.sub{
    font-weight:bold;
}

.search-box{

    width:80%;
    max-width:900px;

    margin:auto;
    margin-top:30px;

    background:#111133;

    padding:25px;

    border:3px solid cyan;

    box-shadow:
    0 0 20px cyan;

}

textarea{

    width:100%;
    height:120px;

    font-size:1.1rem;

    border:none;

    padding:15px;

    background:black;
    color:lime;

}

button{

    background:
    linear-gradient(
    90deg,
    #ff00aa,
    #ffcc00);

    border:none;

    padding:15px 30px;

    margin-top:15px;

    cursor:pointer;

    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
}

.categories{

    display:flex;
    flex-wrap:wrap;
    gap:10px;

    margin-top:20px;

}

.category{

    background:#242452;

    border:2px solid cyan;

    padding:10px;

    cursor:pointer;

}

.category:hover{
    background:#4444aa;
}

.results{

    max-width:1100px;

    margin:auto;

    padding:30px;
}

.card{

    background:#111133;

    border-left:8px solid #00ffff;

    padding:20px;

    margin-bottom:20px;

    box-shadow:
    0 0 12px #00ffff55;

}

.card h2{
    color:#00ffff;
}

.match{
    color:lime;
    font-weight:bold;
}

.status{

    display:inline-block;

    background:#222;

    padding:6px 12px;

    border-radius:20px;

}

.available{
    background:green;
}

.discontinued{
    background:red;
}

.memory-wall{

    max-width:1100px;

    margin:auto;
    padding:20px;
}

.memory-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(200px,1fr));

    gap:15px;

}

.memory{

    background:#1c1c4d;

    padding:15px;

    border:
    2px solid #ff00aa;
}

footer{

    text-align:center;

    padding:40px;

    color:#999;
}

</style>

</head>

<body>

<div id="stars"></div>

<header>

<h1>RECALL VAULT</h1>

<div class="sub">
Describe It. Rediscover It.
</div>

</header>

<div class="search-box">

<h2>What Do You Remember?</h2>

<textarea id="query"
placeholder="A purple drink from the 90s with a weird bottle..."></textarea>

<button onclick="searchMemory()">
SEARCH MY MEMORY
</button>

<div class="categories">

<div class="category">🧸 Toys</div>
<div class="category">🥤 Snacks</div>
<div class="category">📺 TV Shows</div>
<div class="category">🎮 Games</div>
<div class="category">💾 Electronics</div>
<div class="category">🎵 Music</div>

</div>

</div>

<div class="results" id="results">

</div>

<div class="memory-wall">

<h2>Trending Memories</h2>

<div class="memory-grid">

<div class="memory">Furby</div>
<div class="memory">Orbitz Drink</div>
<div class="memory">Moon Shoes</div>
<div class="memory">Skip-It</div>
<div class="memory">Game Boy Pocket</div>
<div class="memory">Tamagotchi</div>

</div>

</div>

<footer>

Recall Vault © 1999*
<br>
*Actually 2026

</footer>

<script>

const database = [

{
name:"Orbitz",
type:"Drink",
status:"Discontinued",
match:["purple","drink","bottle","90s"],
description:
"Fruit drink with floating gel balls."
},

{
name:"Furby",
type:"Toy",
status:"Available",
match:["toy","pet","electronic","furry"],
description:
"Interactive robot pet."
},

{
name:"Game Boy Pocket",
type:"Gaming",
status:"Discontinued",
match:["game","handheld","nintendo"],
description:
"Portable gaming system from Nintendo."
}

];

function searchMemory(){

let query =
document.getElementById("query")
.value.toLowerCase();

let html = "";

database.forEach(item=>{

let score = 0;

item.match.forEach(word=>{

if(query.includes(word))
score += 25;

});

if(score > 0){

html += `

<div class="card">

<h2>${item.name}</h2>

<div class="match">
Match Confidence:
${Math.min(score,100)}%
</div>

<p>
${item.description}
</p>

<p>
Type:
${item.type}
</p>

<span class="status
${item.status==="Available" ? "available" : "discontinued"}">

${item.status}

</span>

</div>

`;

}

});

if(html===""){

html=`

<div class="card">

<h2>No Match Yet</h2>

<p>

Try adding:

<ul>

<li>Color</li>
<li>Year</li>
<li>Package shape</li>
<li>Theme song</li>
<li>Store you bought it from</li>

</ul>

</p>

</div>

`;

}

document.getElementById("results").innerHTML=html;

}

</script>

</body>
</html>
